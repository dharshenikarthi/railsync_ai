services:
  # FastAPI Backend Service
  - type: web
    name: railsync-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: railsync-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # React Frontend (Static Site)
  - type: web
    name: railsync-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: railsync-backend
          property: url

databases:
  - name: railsync-db
    databaseName: RAILSYNC_AI_DB
    user: railsync_admin
