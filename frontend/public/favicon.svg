<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Executive Royal Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001833" />
      <stop offset="50%" stop-color="#002D62" />
      <stop offset="100%" stop-color="#000E1F" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Train Aerodynamic Shading -->
    <linearGradient id="trainChassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Cyan Visor Glass -->
    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Outer Official Emblem Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 2" stroke-opacity="0.6" />

  <!-- Converging Rail Tracks -->
  <path d="M44 104 L26 116 M84 104 L102 116" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
  <line x1="32" y1="112" x2="96" y2="112" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="102" x2="88" y2="102" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

  <!-- Vande Bharat Aerodynamic Train Body -->
  <path d="M46 28 C54 18, 74 18, 82 28 C94 38, 98 62, 92 88 C90 96, 82 99, 64 99 C46 99, 38 96, 36 88 C30 62, 34 38, 46 28 Z" fill="#0C2038" stroke="#38BDF8" stroke-width="2.5" />
  <path d="M48 34 C54 26, 74 26, 80 34 C88 44, 90 64, 86 78 C84 84, 76 86, 64 86 C52 86, 44 84, 42 78 C38 64, 40 44, 48 34 Z" fill="url(#trainChassis)" />

  <!-- Aerodynamic Panoramic Windshield -->
  <path d="M51 38 C56 31, 72 31, 77 38 C82 46, 82 54, 77 58 C72 61, 56 61, 51 58 C46 54, 46 46, 51 38 Z" fill="url(#visorGlass)" stroke="#FFFFFF" stroke-width="1" />

  <!-- National Tri-color Livery Line -->
  <rect x="46" y="66" width="36" height="2.5" rx="1" fill="#FF9933" />
  <rect x="46" y="69.5" width="36" height="2" rx="1" fill="#FFFFFF" />
  <rect x="46" y="72.5" width="36" height="2.5" rx="1" fill="#138808" />

  <!-- Dual Twin Projector Headlights -->
  <circle cx="41" cy="76" r="3.5" fill="#FEF08A" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="87" cy="76" r="3.5" fill="#FEF08A" stroke="#F59E0B" stroke-width="1.5" />

  <!-- AI Neural Network Nodes at Crown -->
  <circle cx="64" cy="18" r="4" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="50" cy="22" r="3" fill="#38BDF8" />
  <circle cx="78" cy="22" r="3" fill="#38BDF8" />
  <line x1="50" y1="22" x2="64" y2="18" stroke="#FDE68A" stroke-width="1.5" />
  <line x1="78" y1="22" x2="64" y2="18" stroke="#FDE68A" stroke-width="1.5" />
</svg>